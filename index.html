<html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123e70"><meta name="description" content="Reserva de citas de Orientación Educativa EPOANT. Tercero 3 y Tercero 4."><title>Agenda de Citas | EPOANT</title><link rel="icon" href="./favicon.png" type="image/png">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}body{background:#eef4fa;color:#17324d;display:flex;flex-direction:column;min-height:100dvh}header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;background:#123e70;color:white;padding:12px max(16px,env(safe-area-inset-left))}.brand{font-weight:800;font-size:15px}.brand small{display:block;font-weight:500;font-size:12px;opacity:.95}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;text-decoration:none;font-size:14px;font-weight:750;border-radius:9px;padding:8px 13px}.nav a{background:white;color:#123e70}.nav a[aria-current="page"]{background:#d0edf5;color:#07536b}main{flex:1;display:flex;flex-direction:column;min-height:calc(100dvh - 70px)}.viewer{flex:1;min-height:calc(100dvh - 70px);width:100%;border:0;background:white;display:block}@media(max-width:650px){header{justify-content:center;text-align:center;padding:10px 12px}.brand{width:100%;font-size:13px}.nav{width:100%;justify-content:center}.nav a{flex:1;max-width:210px}.viewer{min-height:calc(100dvh - 130px)}main{min-height:500px}}
</style></head><body>

<main><iframe class="viewer" id="viewer" title="Agenda de Citas de Orientación Educativa" referrerpolicy="strict-origin-when-cross-origin" allow="clipboard-write"></iframe></main>
<script>
const SERVER='https://script.google.com/macros/s/AKfycbxnL8P3abz8kJeKb-h9_uR4dwivoUNcTmuatvW_ubRVSUQOOVtO8PQH_LxZdCChw4A/exec';

document.title=(isAdmin?'Administración':'Agenda de Citas')+' · EPOANT';
</script></body></html>
